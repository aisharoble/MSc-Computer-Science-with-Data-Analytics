    <main id="main">
      <h1>Register</h1>
<div id="formMsg" role="status" aria-live="polite"></div>
<form id="registerForm" action="#" method="post">
  <label>Full name
    <input type="text" name="fullname" required placeholder="e.g. Aisha Noor" title="Enter your full name" />
  </label>
  <label>Address
    <input type="text" name="address" required placeholder="House number and street" title="Enter your address" />
  </label>
  <label>Telephone
    <input type="tel" name="telephone" required pattern="^[0-9+\s()-]{7,15}$"
           placeholder="+44 7123 456789" title="7–15 digits; spaces and + allowed" />
  </label>
  <label>Email (optional)
    <input type="email" name="email" placeholder="name@example.com" title="Optional email address" />
  </label>

  <fieldset>
    <legend>Membership</legend>
    <label>Plan
      <select name="tier" required>
        <option value="">Choose a plan…</option>
        <option>Basic</option><option>Plus</option><option>Premium</option>
      </select>
    </label>
  </fieldset>

  <fieldset>
    <legend>Interests</legend>
    <label><input type="checkbox" name="int" value="Strength" /> Strength</label>
    <label><input type="checkbox" name="int" value="Cardio" /> Cardio</label>
    <label><input type="checkbox" name="int" value="Yoga" /> Yoga</label>
  </fieldset>

  <label>Comments (optional)
    <textarea name="comments" rows="4" placeholder="Anything we should know?"></textarea>
  </label>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>

    </main>
